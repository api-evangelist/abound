name: Abound
description: 'Abound was a US tax-compliance API company for platforms, marketplaces and fintechs
  serving the 1099 economy. Its v4 REST API covered the full information-return lifecycle: collecting
  Form W-9, W-8BEN and W-8BEN-E from payees, running real-time TIN verification against the IRS,
  then generating, filing, correcting, voiding and physically mailing Form 1099-NEC, 1099-MISC,
  1099-K and 1099-INT to federal and state tax authorities. It also shipped drop-in UI components
  for payee onboarding, a 44-event webhook surface, and an official TypeScript SDK. Abound was
  acquired (announced November 2024) and the service has since been retired: the withabound.com DNS
  zone is fully de-delegated, the API and docs hosts no longer resolve, and the GitHub organization
  has been removed. This profile preserves the API surface, recovered from the first-party Fern API
  Definition shipped inside the official npm package.'
