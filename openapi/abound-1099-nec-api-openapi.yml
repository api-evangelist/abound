openapi: 3.1.0
info:
  title: Abound API - v4 1099-INT 1099-NEC API
  version: '4'
  description: 'Abound was a US tax-compliance API for platforms and marketplaces: W-9 / W-8BEN / W-8BEN-E collection, real-time TIN verification against the IRS, and generation, filing, correction, voiding and physical mailing of Form 1099-NEC, 1099-MISC, 1099-K and 1099-INT with federal and state tax authorities.


    NOTE: This document is a mechanical conversion of the first-party Fern API Definition that Abound shipped inside its official npm package @withabound/node-sdk (v6.0.68). Abound was acquired and the service has been retired: the withabound.com DNS zone is fully de-delegated and the API hosts no longer resolve. This spec is preserved as a historical record of the API surface.'
  x-status: retired
servers:
- url: https://production-api.withabound.com
  description: Production (retired - host no longer resolves)
- url: https://sandbox-api.withabound.com
  description: Sandbox (retired - host no longer resolves)
security:
- bearerAuth: []
tags:
- name: 1099-NEC
paths:
  /v4/documents/1099-nec:
    get:
      operationId: form1099NecList
      tags:
      - 1099-NEC
      summary: List all 1099-NEC documents
      description: Returns a list of 1099-NEC documents.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Page'
      - name: filingYear
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FilingYear'
      - name: payeeTinFingerprint
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PayeeTinFingerprint'
      - name: payerTinFingerprint
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PayerTinFingerprint'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Form1099StatusEnum'
      - name: userId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Form1099NecSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
    post:
      operationId: form1099NecCreate
      tags:
      - 1099-NEC
      summary: Create a 1099-NEC
      description: Creates a 1099-NEC document and subsequently kicks off a TIN Verification, if the name and TIN combo has not been used before.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Form1099NecRequestSchema'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1099NecSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
  /v4/documents/1099-nec/{documentId}:
    get:
      operationId: form1099NecRetrieve
      tags:
      - 1099-NEC
      summary: Retrieve a 1099-NEC
      description: Retrieves the details of an existing 1099-NEC document.
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1099NecSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
    delete:
      operationId: form1099NecDelete
      tags:
      - 1099-NEC
      summary: Delete a 1099-NEC
      description: Deletes a 1099-NEC document. Once an action (`/file`, `/correct`, `/void`) has been executed on a 1099-NEC, it cannot be deleted.
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
  /v4/documents/1099-nec/{documentId}/correct:
    post:
      operationId: form1099NecCorrect
      tags:
      - 1099-NEC
      summary: Correct a 1099-NEC
      description: Files a new corrected 1099-NEC and relates it to the original document. A 1099-NEC can be corrected only after it has reached the `FILED` status. Automatically handles both one-transaction and two-transaction corrections.
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Form1099NecCorrectRequestSchema'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1099NecSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
  /v4/documents/1099-nec/{documentId}/file:
    post:
      operationId: form1099NecFile
      tags:
      - 1099-NEC
      summary: File a 1099-NEC
      description: Files a 1099-NEC document.
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1099NecSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
  /v4/documents/1099-nec/{documentId}/mail:
    post:
      operationId: form1099NecMail
      tags:
      - 1099-NEC
      summary: Mail a 1099-NEC
      description: Mails a 1099-NEC document.
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailingRequestSchema'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
  /v4/documents/1099-nec/{documentId}/void:
    post:
      operationId: form1099NecVoid
      tags:
      - 1099-NEC
      summary: Void a 1099-NEC
      description: Files a new voided 1099-NEC and relates it to the original document. A 1099-NEC can be voided only after it has reached the `FILED` status.
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DocumentId'
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form1099NecSchema'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestSchema'
              example:
                errors:
                - field: metadata.key
                  message: Expected metadata.key to be of type string, but received number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorSchema'
              example:
                message: Internal Server Error
components:
  schemas:
    Form1099FilingStateEnum:
      type: string
      enum:
      - AK
      - AL
      - AR
      - AZ
      - CA
      - CO
      - CT
      - DC
      - DE
      - FL
      - GA
      - HI
      - IA
      - ID
      - IL
      - IN
      - KY
      - KS
      - LA
      - MA
      - MD
      - ME
      - MI
      - MN
      - MO
      - MS
      - MT
      - N/A
      - NC
      - ND
      - NE
      - NH
      - NJ
      - NM
      - NV
      - NY
      - OH
      - OK
      - OR
      - PA
      - RI
      - SC
      - SD
      - TN
      - TX
      - UT
      - VA
      - VT
      - WA
      - WI
      - WV
      - WY
      description: The filing state code. The abbreviation of the state (`CA` for California). If a state filing is not desired, use `N/A`.
    OkSchema:
      type: object
      additionalProperties: {}
    Form1099NecFormFieldsSchema:
      allOf:
      - $ref: '#/components/schemas/Form1099FormFieldsBaseSchema'
      - $ref: '#/components/schemas/Form1099NecFormFieldsRequestSchema'
    IdempotencyKey:
      type: string
      description: The unique key used to identify a request that has already been processed.
    ErrorBadRequestSchemaErrorsItem:
      type: object
      properties:
        field:
          type: string
          description: The field that caused the error.
        message:
          type: string
          description: The error message associated with the field.
      required:
      - message
    PayerRequestSchema:
      allOf:
      - $ref: '#/components/schemas/AddressSchema'
      - type: object
        properties:
          name:
            type: string
            description: The payer's legal name (first + last) or business name.
          name2:
            type: string
            description: The payer's trade name, DBA name, or disregarded entity name, if different from `name`.
          tin:
            type: string
            description: The payer's tax identification number, commonly referred to as a TIN. No hyphens. Numerical digits only. Alternatively, you may pass the corresponding `tinFingerprint`.
            minLength: 9
            maxLength: 9
          phoneNumber:
            type: string
            description: The payer's phone number.
            pattern: ^\+?\d{10,15}$
        required:
        - name
        - phoneNumber
        - tin
      description: The payer of the document.
    MailingRequestToSchema:
      allOf:
      - $ref: '#/components/schemas/MailingNameSchema'
      - $ref: '#/components/schemas/AddressSchema'
      description: The mailing address of the recipient.
    Form1099NecRequestSchema:
      allOf:
      - $ref: '#/components/schemas/Form1099BaseRequestSchema'
      - type: object
        properties:
          formFields:
            $ref: '#/components/schemas/Form1099NecFormFieldsRequestSchema'
        required:
        - formFields
      examples:
      - filingYear: 2024
        payer:
          name: Hooli
          tin: '111111111'
          address: 256 Byron Street
          address2: Suite 32
          city: Palo Alto
          state: CA
          postalCode: '94306'
          country: US
          phoneNumber: '+16501014096'
        payee:
          name: Ada Lovelace
          tin: '000000000'
          address: 1401 N Shoreline Blvd
          address2: Suite 1
          city: Mountain View
          state: CA
          postalCode: '94043'
          country: US
        formFields:
          nonemployeeCompensation: 23423
          hasDirectSalesOver5000: false
          federalIncomeTaxWithheld: 0
          accountNumber: A0NEqtav7n0sBGoq88w0
          stateTaxInfo:
          - filingState: CA
            stateIncome: 23423
            stateTaxWithheld: 0
    Page:
      type: integer
      description: The specific page of results you're requesting. Responses are limited to a maximum of 100 records.
    TinTypeEnum:
      type: string
      enum:
      - INDIVIDUAL
      - BUSINESS
      description: The type of the TIN. `INDIVIDUAL` refers to SSNs, ITINs, or ATINs. While `BUSINESS` refers to EINs.
    MailingStatusEnum:
      type: string
      enum:
      - CREATED
      - PROCESSING_FOR_DELIVERY
      - IN_TRANSIT
      - DELIVERED
      - RETURNED_TO_SENDER
    Form1099NecCorrectRequestSchema:
      allOf:
      - $ref: '#/components/schemas/Form1099BaseCorrectRequestSchema'
      - type: object
        properties:
          formFields:
            $ref: '#/components/schemas/Form1099NecFormFieldsRequestSchema'
        required:
        - formFields
      examples:
      - payee:
          name: Ada Lovelace
          tin: '000000000'
          address: 1401 N Shoreline Blvd
          address2: Suite 1
          city: Mountain View
          state: CA
          postalCode: '94043'
          country: US
        formFields:
          nonemployeeCompensation: 10000
          accountNumber: A0NEqtav7n0sBGoq88w0
          stateTaxInfo:
          - filingState: CA
            stateIncome: 10000
    Form1099BaseCorrectRequestSchema:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        payee:
          $ref: '#/components/schemas/PayeeRequestSchema'
      required:
      - payee
    TinFingerprint:
      type: string
      description: Your unique token that points to a TIN.
    PayerSchema:
      allOf:
      - $ref: '#/components/schemas/PayerRequestSchema'
      - type: object
        properties:
          tinFingerprint:
            $ref: '#/components/schemas/TinFingerprint'
          tinType:
            $ref: '#/components/schemas/TinTypeEnum'
          tinVerificationId:
            $ref: '#/components/schemas/TinVerificationId'
          tinVerificationStatus:
            $ref: '#/components/schemas/TinVerificationStatusEnum'
        required:
        - tinFingerprint
        - tinVerificationId
        - tinVerificationStatus
      description: The payer of the document.
    ErrorBadRequestSchema:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorBadRequestSchemaErrorsItem'
          description: The error message(s) associated with the response status code.
      required:
      - errors
    UserId:
      type: string
      description: The unique identifier for a single end-user of your application.
    MailingNameSchema:
      type: object
      properties:
        name:
          type: string
          description: The individual's name (first + last) or business name.
        name2:
          type: string
          description: The business name, trade name, DBA name, or disregarded entity name, if different from `name`.
    Form1099StateTaxInfoWithStateIncomeSchema:
      allOf:
      - $ref: '#/components/schemas/Form1099StateTaxInfoSchema'
      - type: object
        properties:
          stateIncome:
            type: integer
            description: The state income. Value must be in cents.
            minimum: 0
        required:
        - stateIncome
    Form1099NecFormFieldsRequestSchema:
      type: object
      properties:
        accountNumber:
          type: string
          description: If the payer assigns the contractor a unique number for its records, enter the account number in this box. If not, leave the box blank.
          maxLength: 20
        nonemployeeCompensation:
          type: integer
          description: The total amount remitted by payer to recipient during the year. Value must be in cents.
          minimum: 0
        hasDirectSalesOver5000:
          type: boolean
          description: If `true`, consumer products totaling $5,000 or more were sold to recipient for resale, on a buy-sell, a deposit-commission, or other basis.
        federalIncomeTaxWithheld:
          type: integer
          description: The federal income tax withheld. A payer must backup withhold on certain payments if recipient did not provide a TIN to the payer. Value must be in cents. Abound does not currently support `federalIncomeTaxWithheld` reporting on the 1099-NEC, please contact us for more information.
          minimum: 0
          maximum: 0
        stateTaxInfo:
          type: array
          items:
            $ref: '#/components/schemas/Form1099StateTaxInfoWithStateIncomeSchema'
          description: An array that contains up to two state tax information objects. Abound currently only supports one state tax information object in this array. Abound does not currently support state-level tax withholding reporting on the 1099-NEC, please contact us for more information.
      required:
      - stateTaxInfo
      description: The 1099-NEC form fields.
    Form1099FormFieldsBaseSchema:
      type: object
      properties:
        isVoid:
          type: boolean
          description: If `true`, the void checkbox will be marked on the 1099 document.
        isCorrected:
          type: boolean
          description: If `true`, the corrected checkbox will be marked on the 1099 document.
      required:
      - isCorrected
      - isVoid
    TinVerificationStatusEnum:
      type: string
      enum:
      - MATCH
      - MISMATCH
      - PENDING
      description: The status of the TIN Verification.
    MailingRequestFromSchema:
      allOf:
      - $ref: '#/components/schemas/MailingNameSchema'
      - $ref: '#/components/schemas/AddressSchema'
      description: The mailing address of the sender.
    Form1099BaseRequestSchema:
      type: object
      properties:
        filingYear:
          $ref: '#/components/schemas/FilingYear'
        userId:
          $ref: '#/components/schemas/UserId'
        payer:
          $ref: '#/components/schemas/PayerRequestSchema'
        payee:
          $ref: '#/components/schemas/PayeeRequestSchema'
      required:
      - filingYear
      - payee
      - payer
    PayeeSchema:
      allOf:
      - $ref: '#/components/schemas/PayeeRequestSchema'
      - type: object
        properties:
          tinFingerprint:
            $ref: '#/components/schemas/TinFingerprint'
          tinType:
            $ref: '#/components/schemas/TinTypeEnum'
          tinVerificationId:
            $ref: '#/components/schemas/TinVerificationId'
          tinVerificationStatus:
            $ref: '#/components/schemas/TinVerificationStatusEnum'
        required:
        - tinFingerprint
        - tinVerificationId
        - tinVerificationStatus
      description: The payee of the document.
    Form1099BaseSchema:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DocumentId'
        createdAt:
          type: string
          format: date-time
          description: The `ISO 8601` timestamp when the document was created.
        filingYear:
          $ref: '#/components/schemas/FilingYear'
        status:
          allOf:
          - $ref: '#/components/schemas/Form1099StatusEnum'
          description: 'The status of the 1099 document.<br/>&nbsp;&nbsp;• `CREATED`: The document has passed data validation and the PDFs have been generated.<br/>&nbsp;&nbsp;• `FILED`: The payee''s TIN has been verified and the 1099 has been filed with the appropriate tax authorities.<br/>&nbsp;&nbsp;• `ACCEPTED`: The document has been acknowledged and accepted by the appropriate tax authorities.<br/>&nbsp;&nbsp;• `REJECTED`: The document has a TIN verification `MISMATCH` or has been rejected by one or more tax authories.'
        payerUrl:
          type: string
          description: The URL to the payer's 1099 document. Both the Payer's and Payee's TINs are not masked in this document.
        payeeUrl:
          type: string
          description: The URL to the payee's 1099 document. The Payee's TIN is masked in this document. The Payer's TIN is not masked.
        payer:
          $ref: '#/components/schemas/PayerSchema'
        payee:
          $ref: '#/components/schemas/PayeeSchema'
        correctedById:
          type: string
          description: The `documentId` of the corrected 1099 document.
        correctedFromId:
          type: string
          description: The `documentId` of the original 1099 document.
        voidedById:
          type: string
          description: The `documentId` of the voided 1099 document.
        voidedFromId:
          type: string
          description: The `documentId` of the original 1099 document.
        userId:
          $ref: '#/components/schemas/UserId'
      required:
      - createdAt
