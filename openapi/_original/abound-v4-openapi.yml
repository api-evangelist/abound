openapi: 3.1.0
info:
  title: Abound API - v4
  version: '4'
  description: 'Abound was a US tax-compliance API for platforms and marketplaces: W-9 / W-8BEN / W-8BEN-E
    collection, real-time TIN verification against the IRS, and generation, filing, correction, voiding
    and physical mailing of Form 1099-NEC, 1099-MISC, 1099-K and 1099-INT with federal and state tax authorities.


    NOTE: This document is a mechanical conversion of the first-party Fern API Definition that Abound
    shipped inside its official npm package @withabound/node-sdk (v6.0.68). Abound was acquired and the
    service has been retired: the withabound.com DNS zone is fully de-delegated and the API hosts no longer
    resolve. This spec is preserved as a historical record of the API surface.'
  x-status: retired
servers:
- url: https://production-api.withabound.com
  description: Production (retired - host no longer resolves)
- url: https://sandbox-api.withabound.com
  description: Sandbox (retired - host no longer resolves)
tags:
- name: Access Tokens
- name: Electronic Delivery Consents
- name: 1099-INT
- name: 1099-K
- name: 1099-MISC
- name: 1099-NEC
- name: W-8BEN-E
- name: W-8BEN
- name: W-9
- name: Mailings
- name: Tax Treaties
- name: TIN Verifications
- name: Users
security:
- bearerAuth: []
